name: Import Xenia Canary UWP source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-xenia-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'kuaan08/xenia'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout initialization branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import upstream Xenia Canary UWP source and history
        shell: bash
        run: |
          set -euo pipefail
          git remote add xenia-uwp-source https://github.com/AmitAmit99/xenia-canary-uwp.git
          git fetch --depth=1 --no-tags xenia-uwp-source main
          upstream_commit="$(git rev-parse FETCH_HEAD)"
          echo "Importing source tree from $upstream_commit"
          # Preserve this repository's own workflow. GITHUB_TOKEN cannot
          # import workflow files from another repository without workflows
          # permission, but may import the rest of the upstream Git tree.
          git restore --source="$upstream_commit" --staged --worktree -- . ':(exclude).github/workflows'
          git -c user.name='Xenia UWP Import' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import Xenia Canary UWP source from AmitAmit99"
          git push origin HEAD:main
          echo "Source imported. Follow-up commits will add game library fixes."
